name: CI

on:
  push:
    branches:
      - main
      - feat/classic-hexa-royal-board-system
      - fix/three-board-geometry-validation-2026-11-07
      - integrate/optimist-ludo-unified-2026-11-08
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          find src apps scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Build geometry assets and coordinate map
        run: npm run build
      - name: Validate HEXA board geometry assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          files = sorted(Path("assets/boards").glob("optimist-ludo-hexa-*.svg"))
          if len(files) != 2:
              raise SystemExit(f"Expected exactly 2 HEXA theme SVGs, found {len(files)}")

          for path in files:
              svg = path.read_text(encoding="utf-8")
              ET.fromstring(svg)
              counts = {
                  "track": len(re.findall(r'data-track-cell=', svg)),
                  "home": len(re.findall(r'data-home-cell=', svg)),
                  "base": len(re.findall(r'data-base-slot=', svg)),
                  "finish": len(re.findall(r'data-finish-slot=', svg)),
                  "safe": len(re.findall(r'data-safe-cell=', svg)),
              }
              expected = {"track": 72, "home": 36, "base": 24, "finish": 24, "safe": 12}
              if counts != expected:
                  raise SystemExit(f"{path}: geometry mismatch: {counts}, expected {expected}")
              if "data-avatar=" in svg or "data:image/webp;base64," in svg:
                  raise SystemExit(f"{path}: static player portraits must not be baked into live pawn wells")

          print("Both HEXA themes contain 72 route cells, 36 home cells, 24 base anchors, 24 finish anchors and 12 safe cells.")
          PY
      - name: Validate all board SVG files as XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path("assets/boards").glob("optimist-ludo-*.svg"))
          if len(files) != 4:
              raise SystemExit(f"Expected exactly 4 active board SVGs (2 geometries × 2 themes), found {len(files)}")
          expected = {
              "optimist-ludo-classic.svg",
              "optimist-ludo-neon.svg",
              "optimist-ludo-hexa-classic.svg",
              "optimist-ludo-hexa-neon.svg",
          }
          actual = {path.name for path in files}
          if actual != expected:
              raise SystemExit(f"Unexpected board SVG set: {sorted(actual)}")
          for path in files:
              ET.parse(path)
          print("XML validation passed for the four active board SVGs.")
          PY
      - name: Run test suite against built assets
        run: npm test
      - name: Run local HTTP WebSocket and voice smoke test
        run: npm run smoke
      - name: Package local preview ZIP
        run: |
          zip -qr /tmp/OPTIMIST-LUDO-local.zip . -x ".git/*" "node_modules/*" ".env"
      - name: Upload local preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: optimist-ludo-local-preview
          path: /tmp/OPTIMIST-LUDO-local.zip
          if-no-files-found: error
          retention-days: 7
