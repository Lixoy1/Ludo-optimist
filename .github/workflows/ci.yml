name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          find src apps scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run test suite
        run: npm test
      - name: Package local preview ZIP
        run: |
          zip -qr OPTIMIST-LUDO-local.zip . -x ".git/*" "node_modules/*" ".env" "OPTIMIST-LUDO-local.zip"
      - name: Upload local preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: optimist-ludo-local-preview
          path: OPTIMIST-LUDO-local.zip
          if-no-files-found: error
          retention-days: 7
