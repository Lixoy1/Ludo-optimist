name: CI

on:
  push:
    branches:
      - main
      - feat/classic-hexa-royal-board-system
      - fix/three-board-geometry-validation-2026-11-07
      - integrate/optimist-ludo-unified-2026-11-08
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          find src apps scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Build geometry assets and coordinate map
        run: npm run build
      - name: Validate all board SVG files as XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path("assets/boards").glob("optimist-ludo-*.svg"))
          if len(files) != 12:
              raise SystemExit(f"Expected 12 active board SVGs, found {len(files)}")
          for path in files:
              ET.parse(path)
          print(f"XML validation passed for all {len(files)} active board SVGs.")
          PY
      - name: Run test suite against built assets
        run: npm test
      - name: Run local HTTP WebSocket and voice smoke test
        run: npm run smoke
      - name: Package local preview ZIP
        run: |
          zip -qr /tmp/OPTIMIST-LUDO-local.zip . -x ".git/*" "node_modules/*" ".env"
      - name: Upload local preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: optimist-ludo-local-preview
          path: /tmp/OPTIMIST-LUDO-local.zip
          if-no-files-found: error
          retention-days: 7
