<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPTIMIST LUDO — Extended Boards</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080912;color:#f8f4ea}*{box-sizing:border-box}body{margin:0;padding:22px;background:radial-gradient(ellipse at 50% 0,#292047,transparent 45%),#080912}.wrap{max-width:1100px;margin:auto}.head{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.head h1{font-size:clamp(22px,4vw,36px);margin:0}.head p{color:#a6afc2;margin:5px 0 0}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{border:1px solid #8e744c;background:#171a28;color:#f1d59d;border-radius:10px;padding:10px 14px;font-weight:800}.controls button[aria-pressed=true]{background:#4b351f;border-color:#f2cb7b}.board{background:linear-gradient(135deg,#593a24,#151523 48%,#3a2431);padding:10px;border:1px solid #bb9455;border-radius:20px;box-shadow:0 20px 50px #0009}.board img{display:block;width:min(100%,720px);aspect-ratio:1;object-fit:contain;margin:auto}.note{color:#9ca6bb;font-size:13px;line-height:1.5;margin-top:14px}</style><body><main class="wrap"><header class="head"><div><h1>OPTIMIST LUDO · EXTENDED TABLES</h1><p>Ромб · Пентагон · Гексагон — оригинальные векторные схемы</p></div><div class="controls"><button data-shape="diamond" aria-pressed="true">DIAMOND</button><button data-shape="penta" aria-pressed="false">PENTA</button><button data-shape="hex" aria-pressed="false">HEX</button></div></header><div class="controls"><button data-theme="classic" aria-pressed="false">CLASSIC</button><button data-theme="neon" aria-pressed="true">NEON</button><button data-theme="elite" aria-pressed="false">ELITE</button><button data-theme="marble" aria-pressed="false">MARBLE</button></div><section class="board" style="margin-top:12px"><img id="preview" src="/assets/boards/optimist-ludo-diamond-neon.svg" alt="DIAMOND board preview"></section><p class="note" id="spec">DIAMOND · 4 игрока · 52 клетки · 5 домашних клеток · 8 безопасных клеток.</p></main><script>const c={diamond:'DIAMOND · 4 игрока · 52 клетки · 5 домашних клеток · 8 безопасных клеток.',penta:'PENTA · 5 игроков · 65 клеток · 5 домашних клеток · 10 безопасных клеток.',hex:'HEX · 6 игроков · 78 клеток · 5 домашних клеток · 12 безопасных клеток.'};let shape='diamond',theme='neon';function update(){preview.src='/assets/boards/optimist-ludo-'+shape+'-'+theme+'.svg';spec.textContent=c[shape];document.querySelectorAll('[data-shape]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.shape===shape)));document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));}document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{shape=b.dataset.shape;update()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;update()});update();</script></body></html>
